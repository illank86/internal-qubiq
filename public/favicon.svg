<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="QUBIQ">
  <!--
    Theme-aware favicon. The supplied mark is two-thirds dark grey, which all but
    disappears on a dark tab strip, so dark mode raises every face while keeping
    the same ordering — top-left brightest through to the bottom face — so it
    still reads as one lit cube rather than an inverted one.

    SVG favicons honour prefers-color-scheme; favicon.ico stays as the fallback
    for anything that does not support them.
  -->
  <style>
    .face-a { fill: #e3e2db }
    .face-b { fill: #333333 }
    .face-c { fill: #666666 }
    @media (prefers-color-scheme: dark) {
      .face-a { fill: #f2f1ec }
      .face-b { fill: #8a8a86 }
      .face-c { fill: #b8b8b4 }
    }
  </style>
  <g transform="translate(4.485 1.92) scale(1.4254)">
    <path class="face-a" d="M0 4.60847 9.22288 0v10.30471L0 14.39501Z"/>
    <path class="face-b" d="M0 14.395 9.22288 10.30471 16.15967 16.22641 7.25219 19.75575Z"/>
    <path class="face-c" d="M9.22288 0 16.15967 6.67189v9.55452L9.22288 10.30471Z"/>
  </g>
</svg>
